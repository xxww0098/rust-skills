name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: eval + inspect
        run: |
          python3 scripts/eval-triggers.py
          python3 scripts/eval-fixtures.py
          python3 scripts/inspect_project.py --check-fixtures
          python3 scripts/check_patch.py --check-fixtures
          python3 scripts/render_rust_md.py --check-fixtures

      - name: consistency
        run: bash scripts/check-consistency.sh
